services:
  johnny-five:
    build: .
    image: johnny-five:latest
    container_name: johnny-five
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - johnny-five-data:/data
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - MEMORY_MODEL=all-MiniLM-L6-v2
    # Serves BOTH MCP wire transports from this single process against one
    # database: Streamable HTTP at /mcp and legacy HTTP+SSE at /sse/ +
    # /messages/. "--transport sse" and "--transport http" are aliases for that
    # same dual-endpoint server; "sse" is kept here so existing tooling and docs
    # quoting this command keep matching.
    command: ["--transport", "sse", "--port", "8787"]

  # Read-only memory dashboard + REST API (Tier A / A1). A SEPARATE service
  # from the MCP server above (never mounted into it) that reads the SAME DB
  # volume. It exposes mutating endpoints (archive / importance edit), so the
  # host port is published only on 127.0.0.1 — the container binds 0.0.0.0 for
  # the port map, but the surface never reaches the LAN.
  johnny-five-dashboard:
    build: .
    image: johnny-five:latest
    container_name: johnny-five-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - johnny-five-data:/data
    environment:
      - MEMORY_DB_PATH=/data/memory.db
      - MEMORY_MODEL=all-MiniLM-L6-v2
    command: ["--transport", "api", "--host", "0.0.0.0", "--port", "8788"]

volumes:
  johnny-five-data:
    external: true
